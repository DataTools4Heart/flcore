name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, cmd_line]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel: avoids the multi-GB CUDA download on the runner
          pip install -r requirements.txt -r requirements-dev.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Check that the framework imports
        run: |
          python -c "import flcore.utils"
          python server_cmd.py --help > /dev/null
          python client_cmd.py --help > /dev/null

      - name: Run tests
        run: pytest tests -n 4 --verbose --durations=10

      - name: Upload federation logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-tmp
          path: /tmp/pytest-of-runner/
          if-no-files-found: ignore
          retention-days: 7
